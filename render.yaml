services:
  # React frontend
  - type: web
    name: aero-studio
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Go backend
  - type: web
    name: pumma-backend
    runtime: go
    rootDir: backend
    buildCommand: go build -o app .
    startCommand: ./app